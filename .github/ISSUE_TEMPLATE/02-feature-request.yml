name: 개선 제안
description: 새로운 기능이나 개선 사항을 제안해 주세요.
title: "[제안] "
body:
  - type: markdown
    attributes:
      value: |
        같은 내용의 [이슈](https://github.com/Anchovia/beatscope/issues?q=is%3Aissue)가 있는지 먼저 확인해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 제안 이유
      description: 어떤 점이 불편하거나 개선이 필요한지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 기능이나 개선 사항을 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 다른 방법이 있다면 적어 주세요.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 추가 정보
      description: 참고 자료나 스크린샷이 있다면 첨부해 주세요.
    validations:
      required: false
